<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private, in-browser EPUB reader. Your books never leave your device.">
  <meta name="theme-color" content="#ebe0c5">
  <!-- Defence in depth: only our own scripts run. The reader frame inherits this and adds a
       nonce, so only its typesetting script (js/typeset.js) runs there; see js/reader.js. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self'">
  <title>Web Reader</title>
  <link rel="preload" href="fonts/junicode/JunicodeVF-Roman.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- One row on every screen: ☰, ‹ chapter ›, and on wide screens the text settings.
       On phones app.js moves the text settings into the menu. -->
  <header id="toolbar" class="toolbar">
    <button type="button" id="menu-button" class="menu-button" title="Menu" aria-label="Menu"
            aria-haspopup="true" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>

    <nav id="chapter-controls" class="chapter-controls" aria-label="Chapters" hidden>
      <button type="button" id="prev-button" title="Previous chapter" aria-label="Previous chapter">‹</button>
      <!-- Shows the current chapter's name; choosing another entry jumps to it. -->
      <select id="toc" title="Chapter: choose another to jump to it" aria-label="Chapter"></select>
      <button type="button" id="next-button" title="Next chapter" aria-label="Next chapter">›</button>
    </nav>
    <!-- Shown instead of the chapter controls while no book is open. -->
    <span class="app-name">Web Reader</span>

    <!-- Text settings: on the right of the bar on wide screens, in the menu on phones. -->
    <div id="prefs" class="prefs" role="group" aria-label="Text settings">
      <button type="button" id="font-button" title="Switch between serif and sans-serif">Serif</button>
      <button type="button" id="columns-button" title="Columns per page. Click to change.">2 col</button>
      <button type="button" id="justify-button" title="Switch between justified and ragged-right text">Justified</button>
      <button type="button" id="smaller-button" title="Smaller text" aria-label="Smaller text">A−</button>
      <span id="size-label" class="size-label" aria-live="polite">12 pt</span>
      <button type="button" id="larger-button" title="Larger text" aria-label="Larger text">A+</button>
    </div>

    <!-- Drop-down menu: the open book and opening another (plus the text settings on phones). -->
    <div id="menu" class="menu" role="group" aria-label="Menu" hidden>
      <p class="menu-book">
        <span id="book-title" class="book-title"></span>
        <span id="position" class="position" aria-label="Chapter position"></span>
      </p>
      <div class="menu-row">
        <button type="button" id="open-button" title="Open an EPUB file">Open file…</button>
      </div>
      <input type="file" id="file-input" accept=".epub,application/epub+zip" hidden>
      <!-- novalidate: base64 links are accepted too, which type="url" validation would reject. -->
      <form id="url-form" class="url-form" aria-label="Open an EPUB from a link" novalidate>
        <input type="url" id="url-input" placeholder="Paste an EPUB link…" aria-label="EPUB link"
               inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false">
        <button type="submit" id="url-button" title="Download and open this link">Go</button>
      </form>
    </div>
  </header>

  <main class="stage">
    <section id="welcome" class="welcome" hidden>
      <h1>Web Reader</h1>
      <p>Open an EPUB to start reading.</p>
      <p><button type="button" id="welcome-open-button" class="primary">Choose an EPUB…</button></p>
      <p class="hint">or drop a file anywhere on this page, or paste a link to an EPUB in the ☰ menu.</p>
      <p class="hint">Books are unpacked in your browser and stored only on this device.</p>
    </section>

    <!-- allow-scripts is needed for Safari to deliver events to app.js (WebKit bug 218086);
         scripts from books are still blocked by the frame's Content-Security-Policy. -->
    <iframe id="reader" title="Book content" sandbox="allow-same-origin allow-scripts" hidden></iframe>
    <div id="menu-backdrop" class="menu-backdrop" hidden></div>

    <p id="status" class="status" role="status" aria-live="polite" hidden></p>
  </main>
</body>
</html>
